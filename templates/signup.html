{% extends "base.html" %}
{% block title %}Sign Up – StudyHub{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-header">
    <div class="auth-logo">⬡</div>
    <h1>Create Account</h1>
    <p>Join StudyHub – it's completely free!</p>
  </div>

  <form method="POST" action="{{ url_for('signup') }}" class="auth-form" autocomplete="on">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name"
             placeholder="Jane Doe" required autocomplete="name"/>
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email"
             placeholder="you@school.com" required autocomplete="email"/>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="Minimum 6 characters" required autocomplete="new-password"/>
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password"
             placeholder="Repeat password" required autocomplete="new-password"/>
    </div>
    <button type="submit" class="btn-primary w-full">Create Account →</button>
  </form>

  <p class="auth-switch">
    Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
  </p>
</div>
{% endblock %}
